# Reactive safety net beneath the predictive optimizer (issue #862).
#
# This does NOT replace src/workers/scaling-optimizer.worker.ts. The HPA only
# moves after utilisation has already risen; the optimizer moves before it does.
# Keep minReplicas here at or above the optimizer's policy minimum, or the two
# controllers will fight over the floor.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mentorminds-api
  labels:
    app: mentorminds-api
    managed-by: infrastructure/scaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mentorminds-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      # Match the optimizer's 60s scale-up cooldown.
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      # Match the optimizer's 300s scale-down cooldown. Removing capacity is the
      # direction that causes incidents, so it waits five times as long.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
