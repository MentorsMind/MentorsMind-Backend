name: CI / Deploy to Railway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── Environment ──────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  RAILWAY_ENVIRONMENT: "production"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. CI — type-check + lint + build (runs on every push and PR)
  # ───────────────────────────────────────────────────────────────────────────
  ci:
    name: Build & Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm exec tsc -p tsconfig.build.json --noEmit

      - name: API sunset gate (fail on past sunsetAt without active successor)
        run: pnpm run sunset:check

      - name: Lint
        run: pnpm run lint

      - name: Dependency vulnerability scan (npm audit)
        run: pnpm audit --audit-level=high

      - name: Validate migrations
        run: pnpm run migrate:validate

      - name: Build
        run: pnpm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Migration Tests — fresh apply + idempotency + validate (issue #751)
  #    Runs after `ci` on every push and PR to main.  E2E and deploy jobs both
  #    wait for this job so a broken migration can never reach production.
  # ───────────────────────────────────────────────────────────────────────────
  migration-test:
    name: Migration Tests
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mentorminds_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mentorminds_migration_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration ordering (no duplicates)
        run: pnpm run migrate:validate

      - name: Apply all migrations (fresh database)
        run: pnpm run migrate:up

      - name: Idempotency check (second migrate:up must be a no-op)
        run: |
          OUTPUT=$(pnpm run migrate:up 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "migrating"; then
            echo "ERROR: Second migrate:up applied migrations that should already be present."
            exit 1
          fi
          echo "Idempotency confirmed — no new migrations were applied."

      - name: Rollback test (migrate:down)
        run: pnpm run migrate:down -- --count 9999
        continue-on-error: true

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Security scan — OWASP ZAP baseline + security headers gate (issue #785)
  #    Runs on every push and PR, in parallel with `ci`.
  # ───────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (ZAP + headers)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mentorminds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations (test database)
        run: pnpm run migrate:up
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mentorminds_test

      - name: Start server against the test environment
        run: |
          cp .env.test .env
          nohup pnpm exec ts-node --transpile-only src/bootstrap.ts > server.log 2>&1 &
          npx wait-on -t 60000 http://localhost:5001/health/ready
        env:
          NODE_ENV: test

      - name: Obtain a JWT for authenticated ZAP scanning
        id: auth
        run: |
          curl -s -X POST http://localhost:5001/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"zap-scan@mentorminds.test","password":"ZapScan123!","firstName":"Zap","lastName":"Scan"}' || true
          TOKEN=$(curl -s -X POST http://localhost:5001/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"zap-scan@mentorminds.test","password":"ZapScan123!"}' | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).data.accessToken" 2>/dev/null || echo "")
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5001/api/v1"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-n /zap/wrk/.zap/context.xml"
          fail_action: true
          artifact_name: "zap-baseline-report"
        env:
          ZAP_AUTH_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Rename ZAP report for retention
        if: always()
        run: |
          mkdir -p reports
          cp report_html.html reports/security-scan-report.html 2>/dev/null || true

      - name: Security headers check
        run: pnpm run security:headers-check
        env:
          SECURITY_CHECK_BASE_URL: "http://localhost:5001/api/v1"

      - name: Upload security scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: reports/security-scan-report.html
          retention-days: 90
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # 4. E2E Tests — runs after build + migration-test, blocks deployment if any suite fails
  #
  # Uses testcontainers (Docker-in-Docker via the ubuntu runner's Docker daemon).
  # Each suite gets a fresh PostgreSQL + Redis container managed by Jest's
  # globalSetup/globalTeardown.  No secrets are required — all Stellar/Soroban
  # calls are replaced by in-process mocks.
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [ci, migration-test]
    timeout-minutes: 15

    # testcontainers needs the Docker daemon — ubuntu-latest provides this
    # without any extra setup.
    services: {}

    env:
      # Dummy values — real connections come from testcontainers at runtime
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mentorminds_e2e"
      REDIS_URL: "redis://localhost:6379"
      NODE_ENV: "test"
      JWT_SECRET: "ci-e2e-jwt-secret-at-least-32-characters-long!!!"
      JWT_REFRESH_SECRET: "ci-e2e-refresh-secret-at-least-32-char!!!!"
      JWT_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      ENCRYPTION_KEY: "ci-e2e-encryption-key-exactly-32b!!"
      FILE_SIGNING_SECRET: "ci-e2e-file-signing-secret-32b!!!"
      SECRETS_PROVIDER: "env"
      LOG_LEVEL: "silent"
      STELLAR_NETWORK: "testnet"
      STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"
      CORS_ORIGIN: "*"
      APP_BASE_URL: "http://localhost:5001"
      APP_CLIENT_URL: "http://localhost:3000"
      FRONTEND_URL: "http://localhost:3000"
      MEETING_PROVIDER: "jitsi"
      AWS_S3_BUCKET: "ci-e2e-bucket"
      AWS_ACCESS_KEY_ID: "ci-key"
      AWS_SECRET_ACCESS_KEY: "ci-secret"
      AWS_REGION: "us-east-1"
      SENTRY_DSN: ""
      API_VERSION: "v1"
      # Pass CI flag to jest config (bail=1 on failure)
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pre-pull Docker images so testcontainers startup doesn't count against
      # the test timeout budget.
      - name: Pre-pull testcontainer images
        run: |
          docker pull postgres:15-alpine &
          docker pull redis:7-alpine &
          wait
        continue-on-error: true

      - name: Run E2E test suites
        run: pnpm exec jest --config jest.e2e.config.ts --forceExit
        timeout-minutes: 10

      - name: Upload E2E test results & report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            reports/e2e-report.html
            coverage-e2e/
            tests/e2e/setup/.container-state.json
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Deploy API service to Railway (only on push to main, after CI + E2E + security scan pass)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API → Railway
    runs-on: ubuntu-latest
    # ⚠️  Security scan and E2E must both pass before we deploy
    needs: [ci, security-scan, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API service
        run: railway up --service mentorminds-api --detach --project ${{ secrets.RAILWAY_PROJECT_ID }} --environment ${{ env.RAILWAY_ENVIRONMENT }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # 5. Deploy Worker service to Railway (runs after API deploy)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-worker:
    name: Deploy Workers → Railway
    runs-on: ubuntu-latest
    needs: deploy-api
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Worker service
        run: railway up --service mentorminds-worker --detach --project ${{ secrets.RAILWAY_PROJECT_ID }} --environment ${{ env.RAILWAY_ENVIRONMENT }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
